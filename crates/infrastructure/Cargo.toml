[package]
name = "patrimoine-infrastructure"
version.workspace = true
edition = "2021"

[dependencies]
patrimoine-domain = { path = "../domain" }
patrimoine-application = { path = "../application" }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "backup", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
sha2 = "0.10"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
