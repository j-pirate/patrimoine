[package]
name = "patrimoine-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gestion patrimoniale familiale locale"
default-run = "patrimoine"

[[bin]]
name = "patrimoine"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
patrimoine-domain = { path = "../crates/domain" }
patrimoine-application = { path = "../crates/application" }
patrimoine-infrastructure = { path = "../crates/infrastructure" }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
