name: Vérifications Linux
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  socle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Prérequis Tauri
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - name: Toolchain Rust épinglée
        run: rustup show active-toolchain
      - name: Dépendances frontend
        run: npm ci --no-audit --no-fund
      - name: Tests et compilation
        run: bash scripts/check.sh
